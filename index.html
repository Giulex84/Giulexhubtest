<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Giulex Hub Test - Arena Logic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>
  <style>
    body { margin: 0; min-height: 100vh; font-family: sans-serif; background: #10101a; color: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
    .app { width: 90%; max-width: 420px; background: #17172a; padding: 20px; border-radius: 20px; border: 1px solid #3a3f58; text-align: center; }
    
    /* Stili Arena estratti da Mainnet */
    #game-container { display: none; margin-top: 20px; }
    .grid { display: grid; gap: 8px; margin: 20px auto; max-width: 300px; }
    .card { aspect-ratio: 1; background: #1a1a1a; border: 2px solid #b30000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s; }
    .card.flipped { background: #b30000; }

    button { width: 100%; border-radius: 12px; padding: 14px; cursor: pointer; font-weight: 600; margin-top: 15px; border: none; transition: opacity 0.2s; }
    #login { background: #5a6cff; color: #fff; }
    #u2a { background: #ff9f43; color: #fff; }
    #status { margin-top: 20px; padding: 10px; border-radius: 10px; background: #0f0f1d; font-family: monospace; font-size: 0.75rem; color: #00ff00; border: 1px solid #222; }
  </style>
</head>
<body>
  <main class="app">
    <h2>⚔ ARENA TESTNET ⚔</h2>
    <div id="user-info"></div>
    
    <button id="login">Accedi con Pi Browser</button>

    <div id="game-container">
      <p id="stats">Livello: 1 | Punti: 0</p>
      <div id="grid" class="grid"></div>
      <button id="u2a">Sblocca Bonus Premium (0.1 Test-Pi)</button>
    </div>

    <div id="status">Stato: In attesa di login...</div>
  </main>

  <script>
    // --- CONFIGURAZIONE E VARIABILI DI STATO ---
    const symbols = ["⚔", "🔥", "🛡", "🏹", "👑", "💎", "⚡", "🩸", "🧠", "🐉", "🌑", "☠"];
    let cards = [];
    let selected = [];
    let score = 0;
    let level = 1;
    let premium = false;
    let piUser = null;

    // Elementi DOM
    const loginBtn = document.getElementById("login");
    const gameContainer = document.getElementById("game-container");
    const gridEl = document.getElementById("grid");
    const statsEl = document.getElementById("stats");
    const statusEl = document.getElementById("status");
    const u2aBtn = document.getElementById("u2a");

    // --- LOGICA PI SDK (Tua originale) ---
    loginBtn.onclick = async () => {
      try {
        statusEl.textContent = "Autenticazione...";
        const auth = await Pi.authenticate(["username", "payments", "wallet_address"]);
        piUser = auth.user;
        document.getElementById("user-info").textContent = `👤 ${piUser.username}`;
        statusEl.textContent = "Login effettuato!";
        loginBtn.style.display = "none";
        gameContainer.style.display = "block";
        initGame(); // Avvia il gioco dopo il login
      } catch (err) {
        statusEl.textContent = "Errore Login: " + err.message;
      }
    };

    u2aBtn.onclick = async () => {
      statusEl.textContent = "Inizializzazione Pagamento...";
      try {
        await Pi.createPayment({
          amount: 0.1,
          memo: "Arena Premium Unlock",
          metadata: { uid: piUser.uid },
        }, {
          onReadyForServerApproval: async (paymentId) => {
            await fetch("/api/pi-payment", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "approve", paymentId })
            });
          },
          onReadyForServerCompletion: async (paymentId, txid) => {
            await fetch("/api/pi-payment", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "complete", paymentId, txid })
            });
            premium = true;
            u2aBtn.style.display = "none";
            statusEl.textContent = "Premium Attivato! ✅ Punti raddoppiati.";
          },
          onCancel: () => { statusEl.textContent = "Pagamento annullato."; },
          onError: (error) => { statusEl.textContent = "Errore SDK: " + error.message; },
        });
      } catch (err) { statusEl.textContent = "Errore: " + err.message; }
    };

    // --- LOGICA DI GIOCO (Estrapolata da Arena Mainnet) ---
    function initGame() {
      const size = (premium || level <= 3) ? 4 : (level <= 6 ? 5 : 6);
      // Nota: Per semplicità in JS Vanilla usiamo sempre griglie pari
      const totalCards = size * size;
      const pairCount = Math.floor(totalCards / 2);
      
      let gameSymbols = symbols.slice(0, pairCount);
      let doubled = [...gameSymbols, ...gameSymbols];
      doubled.sort(() => Math.random() - 0.5);

      gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      gridEl.innerHTML = "";
      cards = [];
      selected = [];

      doubled.forEach((sym, index) => {
        const cardObj = { id: index, value: sym, flipped: false, matched: false };
        cards.push(cardObj);

        const cardEl = document.createElement("div");
        cardEl.classList.add("card");
        cardEl.dataset.id = index;
        cardEl.onclick = () => handleFlip(cardObj, cardEl);
        gridEl.appendChild(cardEl);
      });
    }

    function handleFlip(card, el) {
      if (card.flipped || card.matched || selected.length === 2) return;

      card.flipped = true;
      el.classList.add("flipped");
      el.textContent = card.value;
      selected.push({ card, el });

      if (selected.length === 2) {
        setTimeout(checkMatch, 600);
      }
    }

    function checkMatch() {
      const [a, b] = selected;
      if (a.card.value === b.card.value) {
        a.card.matched = true;
        b.card.matched = true;
        score += premium ? 20 : 10;
        
        if (cards.every(c => c.matched)) {
          level++;
          statusEl.textContent = "Livello Completato! Caricamento...";
          setTimeout(initGame, 1000);
        }
      } else {
        a.card.flipped = false;
        b.card.flipped = false;
        a.el.classList.remove("flipped");
        b.el.classList.remove("flipped");
        a.el.textContent = "";
        b.el.textContent = "";
      }
      selected = [];
      statsEl.textContent = `Livello: ${level} | Punti: ${score}`;
    }
  </script>
</body>
</html>
