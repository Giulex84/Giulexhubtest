<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Giulex Hub – Pi Payments Testnet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0" });
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      color: #e5e7eb;
      font-family: system-ui;
    }
    .app {
      max-width: 420px;
      width: 100%;
      background: #0f172a;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      text-align: center;
    }
    button {
      width: 100%;
      border-radius: 999px;
      border: none;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #f97316;
      color: #111827;
      margin-bottom: 12px;
    }
    .secondary {
      background: transparent;
      color: #e5e7eb;
      border: 1px solid rgba(148, 163, 184, 0.5);
    }
    .status {
      padding: 10px;
      font-size: 0.8rem;
      border-radius: 8px;
      background: #020617;
      white-space: pre-line;
    }
  </style>
</head>

<body>
<main class="app">
  <h2>Giulex Hub</h2>
  <p>Pi Payments – Testnet</p>

  <button id="login">Login with Pi</button>
  <button id="u2a" class="secondary" style="display:none;">U2A – Paga 1 Test-Pi</button>
  <button id="a2u" class="secondary" style="display:none;">A2U – Ricevi 1 Test-Pi</button>

  <div id="status" class="status">Stato: inattivo</div>
</main>

<script>
const loginBtn = document.getElementById("login");
const u2aBtn = document.getElementById("u2a");
const a2uBtn = document.getElementById("a2u");
const statusEl = document.getElementById("status");

let piUser = null;

function onIncompletePayment(payment) {
  console.log("Incomplete payment", payment);
}

loginBtn.onclick = async () => {
  try {
    const auth = await Pi.authenticate(
      ["username", "payments", "wallet_address"],
      onIncompletePayment
    );

    piUser = auth.user;

    statusEl.textContent = "Login completato ✅";
    loginBtn.style.display = "none";
    u2aBtn.style.display = "block";
    a2uBtn.style.display = "block";

  } catch (err) {
    statusEl.textContent = "Errore autenticazione";
  }
};

u2aBtn.onclick = async () => {
  Pi.createPayment(
    {
      amount: 1,
      memo: "Giulex Hub Test Payment",
      metadata: { type: "U2A" }
    },
    {
      onReadyForServerApproval: async (paymentId) => {
        await fetch("/api/pi-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "approve", paymentId })
        });
      },
      onReadyForServerCompletion: async (paymentId, txid) => {
        await fetch("/api/pi-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "complete", paymentId, txid })
        });
        statusEl.textContent = "U2A completato ✅";
      }
    }
  );
};

a2uBtn.onclick = async () => {
  statusEl.textContent = "Creazione A2U...";

  const r = await fetch("/api/a2u", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ uid: piUser.uid, amount: 1 })
  });

  const data = await r.json();

  if (!data.success) {
    statusEl.textContent = "Errore A2U";
    return;
  }

  const paymentId = data.paymentId;

  statusEl.textContent = "A2U creata. Attendi firma nel wallet...";

  // Polling ogni 3 secondi
  const interval = setInterval(async () => {
    const check = await fetch("/api/check-payment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paymentId })
    });

    const result = await check.json();

    if (result.transaction_verified) {
      clearInterval(interval);

      await fetch("/api/pi-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "complete",
          paymentId,
          txid: result.txid
        })
      });

      statusEl.textContent = "A2U completato ✅";
    }
  }, 3000);
};
</script>

</body>
</html>
