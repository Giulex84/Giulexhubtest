<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Giulexhubtest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0" });
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui;
      background: #10101a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 420px;
      background: #17172a;
      padding: 22px;
      border-radius: 16px;
      border: 1px solid #3a3f58;
      text-align: center;
    }

    button {
      width: 100%;
      border-radius: 999px;
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 12px;
      background: #5a6cff;
      color: #fff;
      border: none;
    }

    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #202037;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <main class="app">
    <h2>Giulexhubtest</h2>
    <p>Testnet A2U environment</p>

    <button id="login">Login with Pi</button>
    <button id="a2u" style="display:none;">Receive Test Pi (A2U)</button>

    <div id="status">State: inactive</div>
  </main>

  <script>
  const loginBtn = document.getElementById("login");
  const a2uBtn = document.getElementById("a2u");
  const statusEl = document.getElementById("status");

  let piUser = null;

  loginBtn.onclick = async () => {
    try {
      statusEl.textContent = "Authenticating...";

      const auth = await Pi.authenticate(
        ["username", "wallet_address"]
      );

      piUser = auth.user;

      statusEl.textContent = `Logged in as: ${piUser.username}`;
      loginBtn.style.display = "none";
      a2uBtn.style.display = "block";

    } catch (err) {
      console.error("AUTH ERROR:", err);
      statusEl.textContent = "Authentication error ❌";
    }
  };

  // 🔥 A2U IDENTICO AL VECCHIO COMPORTAMENTO
  a2uBtn.onclick = async () => {
    if (!piUser) {
      statusEl.textContent = "Login required ❌";
      return;
    }

    try {
      statusEl.textContent = "Requesting A2U payment...";

      const res = await fetch("/api/a2u", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          uid: piUser.uid,
          amount: 1   // 👈 QUESTO MANCAVA
        })
      });

      const data = await res.json();

      if (res.ok) {
        statusEl.textContent =
          `A2U Success ✅\nPaymentId: ${data.paymentId}`;
      } else {
        statusEl.textContent =
          `A2U Error ❌\n${JSON.stringify(data)}`;
      }

    } catch (err) {
      console.error("A2U ERROR:", err);
      statusEl.textContent = "A2U request failed ❌";
    }
  };
  </script>
</body>
</html>
