<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Arena Lab - Testnet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0" });
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui;
      background: #10101a;
      color: #eef0fb;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: 420px;
      background: #0f172a;
      padding: 22px;
      border-radius: 16px;
      border: 1px solid #3a3f58;
      text-align: center;
    }
    button {
      width: 100%;
      border-radius: 999px;
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 12px;
      background: #5a6cff;
      color: #fff;
      border: none;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #020617;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <main class="app">
    <h2>Arena Lab</h2>
    <p>Sandbox payment flow testing</p>

    <button id="login">Login with Pi</button>
    <button id="u2a" style="display:none;">U2A - Test Payment</button>
    <button id="a2u" style="display:none;">A2U - Receive Test-Pi</button>

    <div id="status">State: inactive</div>
  </main>

<script>
const loginBtn = document.getElementById("login");
const u2aBtn = document.getElementById("u2a");
const a2uBtn = document.getElementById("a2u");
const statusEl = document.getElementById("status");

let piUser = null;

function onIncompletePayment(payment) {
  console.log("Incomplete payment", payment);
  statusEl.textContent = `Incomplete payment found:\n${JSON.stringify(payment)}`;
}

loginBtn.onclick = async () => {
  try {
    statusEl.textContent = "Authenticating...";

    const auth = await Pi.authenticate(
      ["username", "payments", "wallet_address"],
      onIncompletePayment
    );

    piUser = auth.user;

    statusEl.textContent = `Logged in as: ${piUser.username}`;
    loginBtn.style.display = "none";
    u2aBtn.style.display = "block";
    a2uBtn.style.display = "block";

  } catch (err) {
    console.error("AUTH ERROR:", err);
    statusEl.textContent = "Authentication error ❌";
  }
};

u2aBtn.onclick = async () => {
  if (!piUser) {
    statusEl.textContent = "Login required ❌";
    return;
  }

  statusEl.textContent = "Creating U2A payment...";

  try {
    await Pi.createPayment(
      {
        amount: 1,
        memo: "Arena Lab - Test Payment",
        metadata: { type: "U2A" },
      },
      {
        onReadyForServerApproval: async (paymentId) => {
          statusEl.textContent = `Approving: ${paymentId}`;

          await fetch("/api/pi-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "approve", paymentId }),
          });
        },

        onReadyForServerCompletion: async (paymentId, txid) => {
          statusEl.textContent = `Completing: ${paymentId}`;

          const res = await fetch("/api/pi-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "complete", paymentId, txid }),
          });

          const data = await res.json();

          if (!res.ok) {
            console.error("Complete error:", data);
            statusEl.textContent = "U2A complete failed ❌";
            return;
          }

          statusEl.textContent = "U2A completed ✔";
        },
      }
    );
  } catch (err) {
    console.error("U2A ERROR:", err);
    statusEl.textContent = "U2A failed ❌";
  }
};

a2uBtn.onclick = async () => {
  if (!piUser) {
    statusEl.textContent = "Login required ❌";
    return;
  }

  statusEl.textContent = "Requesting A2U...";

  try {
    const r = await fetch("/api/a2u", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid: piUser.uid, amount: 1 }),
    });

    const data = await r.json();

    if (!data.success) {
      statusEl.textContent = "A2U failed ❌";
      return;
    }

    statusEl.textContent = "A2U completed ✔";

  } catch (err) {
    console.error("A2U ERROR:", err);
    statusEl.textContent = "A2U failed ❌";
  }
};
</script>
</body>
</html>
