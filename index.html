<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Giulex Hub Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h1>Giulex Hub Testnet</h1>
  <button id="loginBtn">Login with Pi</button>

  <script>
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      try {
        const auth = await Pi.authenticate(
          ["username"],
          onIncompletePaymentFound
        );

        console.log("Auth success:", auth);

        const uid = auth.user.uid;
        const walletAddress = auth.user.wallet_address;

        console.log("User UID:", uid);
        console.log("Wallet address:", walletAddress);

        if (!walletAddress) {
          alert("No wallet address found for this user.");
          return;
        }

        const response = await fetch("/api/a2u", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            recipient: walletAddress,
            amount: 1
          })
        });

        const result = await response.json();
        console.log("A2U response:", result);

        if (response.ok) {
          alert("A2U request sent successfully.");
        } else {
          alert("A2U error. Check console.");
        }

      } catch (err) {
        console.error("Login/A2U error:", err);
        alert("Error occurred. Check console.");
      }
    });
  </script>
</body>
</html>
