<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Arena Test - Pi Network</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>
  <style>
    :root {
      --bg: #0f0f1a;
      --card-bg: #17172a;
      --primary: #5a6cff;
      --accent: #ff4757;
      --gold: #ffa502;
      --heal: #2ecc71;
      --text: #ffffff;
    }
    body { margin: 0; min-height: 100vh; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; }
    .app { width: 95%; max-width: 450px; background: var(--card-bg); padding: 25px; margin-top: 20px; border-radius: 24px; border: 1px solid #3a3f58; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { margin: 0 0 10px 0; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); }
    .info-box { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.4; border: 1px solid #333; }
    .stats-bar { display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; font-family: monospace; border: 1px solid #222; }
    .lives { color: var(--accent); transition: all 0.3s; }
    .lives.heal { color: var(--heal); transform: scale(1.2); }
    .combo-text { color: var(--gold); height: 20px; font-size: 0.9rem; margin-bottom: 10px; font-weight: bold; }
    .grid { display: grid; gap: 8px; margin: 0 auto 20px auto; }
    .card { aspect-ratio: 1; background: #1a1a2e; border: 2px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; transition: transform 0.2s, background 0.2s; }
    .small-font { font-size: 1rem !important; }
    .card.flipped { background: var(--accent); }
    button { width: 100%; border-radius: 12px; padding: 15px; cursor: pointer; font-weight: 700; margin-top: 10px; border: none; text-transform: uppercase; }
    #login { background: var(--primary); color: #fff; }
    #u2a { background: var(--gold); color: #000; box-shadow: 0 4px 15px rgba(255, 165, 2, 0.3); }
    #status { margin-top: 20px; padding: 12px; border-radius: 10px; background: #000; font-family: monospace; font-size: 0.8rem; color: #00ff00; border: 1px solid #222; }
    footer { margin: 30px 0; font-size: 0.85rem; opacity: 0.7; }
    footer a { color: var(--primary); text-decoration: none; margin: 0 10px; }
    .shake { animation: shake 0.4s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  </style>
</head>
<body>

  <main class="app">
    <h2>⚔ ARENA TEST ⚔</h2>
    <div id="user-display" style="font-size: 0.9rem; margin-bottom: 15px; opacity: 0.8;">Login to enter the Arena</div>
    
    <div id="welcome-msg" class="info-box">
      <strong>How to play:</strong> Match the cards to survive. <br>
      🔥 <strong>Combo x3:</strong> Earn a <strong>0.3 Pi</strong> reward!<br>
      🏆 <strong>Premium:</strong> Unlock infinite lives for 10 levels.
    </div>

    <button id="login">LOGIN WITH PI BROWSER</button>

    <div id="game-ui" style="display: none;">
      <div class="stats-bar">
        <span>LVL: <span id="lvl">1</span></span>
        <span class="lives" id="lives-container">LIVES: <span id="lives">5</span></span>
        <span>PTS: <span id="score">0</span></span>
      </div>
      <div id="combo-box" class="combo-text"></div>
      <div id="grid" class="grid"></div>
      <div id="payment-area">
        <button id="u2a">UNLOCK PREMIUM (1.0 Test-π)</button>
        <p style="font-size: 0.7rem; margin-top: 5px;">Valid for 10 levels</p>
      </div>
    </div>
    <div id="status">Status: Waiting for login...</div>
  </main>

  <footer>
    <a href="/privacy.html">Privacy Policy</a> | <a href="/terms.html">Terms of Service</a>
  </footer>

  <script>
    const symbols = ["⚔", "🔥", "🛡", "🏹", "👑", "💎", "⚡", "🩸", "🧠", "🐉", "🌑", "☠", "🍄", "⭐", "🌪", "🧊", "🌋", "🧿"];
    let piUser = null, cards = [], selected = [], score = 0, level = 1, lives = 5, combo = 0, premiumUntil = 0;

    const onIncompletePaymentFound = async (payment) => {
      return await fetch("/api/pi-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "complete", paymentId: payment.identifier, txid: payment.transaction.txid })
      });
    };

    document.getElementById("login").onclick = async () => {
      try {
        const auth = await Pi.authenticate(["username", "payments", "wallet_address"], onIncompletePaymentFound);
        piUser = auth.user;
        document.getElementById("user-display").textContent = `Hero: ${piUser.username}`;
        document.getElementById("login").style.display = "none";
        document.getElementById("welcome-msg").style.display = "none";
        document.getElementById("game-ui").style.display = "block";
        initGame();
      } catch (err) { document.getElementById("status").textContent = "Error: " + err.message; }
    };

    document.getElementById("u2a").onclick = async () => {
      try {
        await Pi.createPayment({
          amount: 1.0,
          memo: "Arena Test Premium - 10 Levels",
          metadata: { uid: piUser.uid },
        }, {
          onReadyForServerApproval: async (pId) => {
            await fetch("/api/pi-payment", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "approve", paymentId: pId }) });
          },
          onReadyForServerCompletion: async (pId, txid) => {
            await fetch("/api/pi-payment", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "complete", paymentId: pId, txid: txid }) });
            premiumUntil = level + 10;
            updateStats();
          }
        });
      } catch (err) { console.error(err); }
    };

    async function claimReward() {
      try {
        await fetch("/api/a2u", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uid: piUser.uid, amount: 0.3 })
        });
        document.getElementById("status").textContent = "0.3 Pi Reward Sent! ✅";
      } catch (e) { console.error(e); }
    }

    function initGame() {
      const isPremium = level < premiumUntil;
      let size = level === 1 ? 2 : (level <= 3 ? 4 : 6);
      if (level > 10) size = 6;
      if (!isPremium) {
        lives = Math.min(5 + (level - 1), 10);
        document.getElementById("u2a").style.display = "block";
      } else {
        document.getElementById("u2a").style.display = "none";
      }
      let doubled = [...symbols.slice(0, (size*size)/2), ...symbols.slice(0, (size*size)/2)].sort(() => Math.random() - 0.5);
      document.getElementById("grid").style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      document.getElementById("grid").innerHTML = ""; cards = []; selected = []; updateStats();
      doubled.forEach((sym, i) => {
        const c = { id: i, value: sym, flipped: false, matched: false };
        cards.push(c);
        const el = document.createElement("div"); el.className = "card"; if(size>4) el.classList.add("small-font");
        el.onclick = () => {
          if (c.flipped || c.matched || selected.length === 2 || (level >= premiumUntil && lives <= 0)) return;
          c.flipped = true; el.classList.add("flipped"); el.textContent = c.value;
          selected.push({ c, el });
          if (selected.length === 2) setTimeout(checkMatch, 500);
        };
        document.getElementById("grid").appendChild(el);
      });
    }

    function checkMatch() {
      const isPremium = level < premiumUntil;
      const [a, b] = selected;
      if (a.c.value === b.c.value) {
        a.c.matched = b.c.matched = true; combo++;
        if (!isPremium && lives < 10) { lives++; document.getElementById("lives-container").classList.add("heal"); setTimeout(()=>document.getElementById("lives-container").classList.remove("heal"),500); }
        if (combo === 3) claimReward();
        score += (isPremium ? 20 : 10) * combo;
        document.getElementById("combo-box").textContent = combo >= 3 ? "🔥 TRIPLE COMBO! 0.3π SENT" : `COMBO X${combo}!`;
        if (cards.every(c => c.matched)) { level++; setTimeout(initGame, 1000); }
      } else {
        combo = 0; document.getElementById("combo-box").textContent = "";
        if (!isPremium) { lives--; document.getElementById("grid").classList.add("shake"); setTimeout(()=>document.getElementById("grid").classList.remove("shake"),400); }
        setTimeout(() => { a.el.classList.remove("flipped"); b.el.classList.remove("flipped"); a.el.textContent = ""; b.el.textContent = ""; a.c.flipped = b.c.flipped = false; }, 400);
      }
      updateStats(); selected = [];
    }

    function updateStats() {
      const isPremium = level < premiumUntil;
      document.getElementById("lvl").textContent = level;
      document.getElementById("lives").textContent = isPremium ? "∞" : lives;
      document.getElementById("score").textContent = score;
    }
  </script>
</body>
</html>
