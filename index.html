<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Giulex Hub Testnet</title>

  <!-- PI SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body>
  <h1>Giulex Hub Testnet</h1>
  <button id="loginBtn">Login with Pi</button>

  <script>
    document.getElementById("loginBtn").addEventListener("click", async () => {
      try {

        // 🔐 Must be inside Pi Browser
        if (typeof Pi === "undefined") {
          alert("Open this app inside Pi Browser.");
          return;
        }

        // 🧪 TESTNET MODE
        Pi.init({ version: "2.0", sandbox: true });

        console.log("Pi initialized (Testnet)");

        // 🔐 LOGIN
        const auth = await Pi.authenticate(
          ["username"],
          onIncompletePaymentFound
        );

        console.log("Auth success:", auth);

        const uid = auth.user.uid;
        console.log("User UID:", uid);

        // ===============================
        // 🟣 STEP 1 — U2A (Initialize Wallet)
        // ===============================
        console.log("Creating U2A payment...");

        const payment = await Pi.createPayment({
          amount: 0.1,
          memo: "Wallet Initialization",
          metadata: { init: true }
        });

        console.log("U2A created:", payment);

        alert("Approve the 0.1 Pi payment to initialize wallet.");

        // ===============================
        // 🔥 STEP 2 — A2U
        // ===============================
        console.log("Calling A2U...");

        const response = await fetch("/api/a2u", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            uid: uid,
            amount: 1
          })
        });

        const data = await response.json();
        console.log("A2U response:", data);

        if (response.ok) {
          alert("A2U request sent successfully!");
        } else {
          alert("A2U error. Check console.");
        }

      } catch (err) {
        console.error("Flow error:", err);
        alert("Operation failed. Check console.");
      }
    });

    // Required callback
    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }
  </script>
</body>
</html>
