<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Giulex Hub Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body>
  <h1>Giulex Hub Testnet</h1>
  <button id="loginBtn">Login & Init Wallet</button>

  <script>
    document.getElementById("loginBtn").addEventListener("click", async () => {
      try {

        if (typeof Pi === "undefined") {
          alert("Open inside Pi Browser.");
          return;
        }

        Pi.init({ version: "2.0" });

        console.log("Pi initialized");

        const auth = await Pi.authenticate(
          ["username"],
          onIncompletePaymentFound
        );

        console.log("Auth:", auth);

        // ===============================
        // 🔵 U2A CREATE
        // ===============================
        const payment = await Pi.createPayment(
          {
            amount: 0.1,
            memo: "Wallet Initialization",
            metadata: { init: true }
          },
          {
            onReadyForServerApproval: async function(paymentId) {
              console.log("Ready for approval:", paymentId);

              await fetch("/api/pi-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  action: "approve",
                  paymentId: paymentId
                })
              });
            },

            onReadyForServerCompletion: async function(paymentId, txid) {
              console.log("Ready for completion:", paymentId, txid);

              await fetch("/api/pi-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  action: "complete",
                  paymentId: paymentId,
                  txid: txid
                })
              });

              alert("U2A completed. Wallet initialized.");
            },

            onCancel: function(paymentId) {
              console.log("Payment cancelled", paymentId);
            },

            onError: function(error, payment) {
              console.error("Payment error", error);
            }
          }
        );

      } catch (err) {
        console.error("Error:", err);
        alert("Operation failed.");
      }
    });

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }
  </script>
</body>
</html>
