<!DOCTYPE html>
<html>
<head>
  <title>Giulex Hub Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body>
  <h1>Giulex Hub Testnet</h1>

  <button id="loginBtn">Login with Pi</button>

  <script>
    console.log("Page loaded");

    // 🔥 INIT PI SDK
    Pi.init({
      version: "2.0",
      sandbox: true // TESTNET
    });

    async function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {

      try {

        // 🔒 Safety check
        if (typeof Pi === "undefined") {
          alert("Open this app inside Pi Browser.");
          return;
        }
console.log("Pi initialized");

        // 🔐 LOGIN
        const auth = await Pi.authenticate(
          ["username"],
          onIncompletePaymentFound
        );

        console.log("Auth success:", auth);

        const uid = auth.user.uid;
        console.log("User UID:", uid);

        // 🔥 A2U CALL
        const response = await fetch("/api/a2u", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            uid: uid,
            amount: 1
          })
        });

        const data = await response.json();
        console.log("A2U response:", data);

        if (response.ok) {
          alert("A2U request sent successfully!");
        } else {
          alert("A2U error. Check console.");
        }

      } catch (err) {
        console.error("Login error:", err);
        alert("Login failed. Check console.");
      }

    });
  </script>

</body>
</html>
