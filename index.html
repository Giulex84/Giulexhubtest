<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>giulexhubtest – Pi Testnet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // ✅ TESTNET SANDBOX
  Pi.init({
    version: "2.0",
    sandbox: true
  });

});
</script>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui;
  background: #0f1016;
  color: #eef0fb;
  display: flex;
  justify-content: center;
  align-items: center;
}
.app {
  width: 420px;
  background: #1b1f2a;
  padding: 22px;
  border-radius: 16px;
  border: 1px solid #3a3f58;
  text-align: center;
}
.badge {
  background: #ffcc00;
  color: #000;
  font-weight: bold;
  padding: 6px 12px;
  border-radius: 8px;
  margin-bottom: 12px;
  font-size: 14px;
}
button {
  width: 100%;
  border-radius: 999px;
  padding: 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 1rem;
  margin-top: 12px;
  background: #4a6cff;
  color: #fff;
  border: none;
}
button.secondary {
  background: transparent;
  border: 1px solid rgba(148, 163, 184, 0.5);
  color: #eef0fb;
}
#status {
  margin-top: 15px;
  padding: 10px;
  border-radius: 8px;
  background: #202635;
  white-space: pre-line;
}
.links {
  text-align:center;
  margin-top:30px;
  font-size:14px;
}
.links a {
  color:#fff;
  text-decoration:none;
  margin:0 8px;
}
</style>
</head>

<body>

<main class="app">

<div class="badge">🧪 giulexhubtest – TESTNET MODE</div>

<h2>giulexhubtest</h2>
<p>Sandbox environment for U2A & A2U testing</p>

<button id="login">Login with Pi</button>
<button id="u2a" class="secondary" style="display:none;">U2A – Test Payment</button>
<button id="a2u" class="secondary" style="display:none;">A2U – Receive Test Pi</button>

<div id="status">State: inactive</div>

</main>

<script>

const loginBtn = document.getElementById("login");
const u2aBtn = document.getElementById("u2a");
const a2uBtn = document.getElementById("a2u");
const statusEl = document.getElementById("status");

let piUser = null;

function onIncompletePaymentFound(payment) {
  console.log("Incomplete payment", payment);
  statusEl.textContent =
    "Incomplete payment found:\n" + JSON.stringify(payment, null, 2);
}

// 🔐 AUTH
loginBtn.onclick = async () => {
  try {
    statusEl.textContent = "Authenticating...";
    const auth = await Pi.authenticate(
      ["username", "payments", "wallet_address"],
      onIncompletePaymentFound
    );

    piUser = auth.user;

    statusEl.textContent = "Logged in as: " + piUser.username;

    loginBtn.style.display = "none";
    u2aBtn.style.display = "block";
    a2uBtn.style.display = "block";

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Authentication error";
  }
};

// 💸 U2A TEST
u2aBtn.onclick = async () => {

  statusEl.textContent = "Creating U2A test payment...";

  try {
    await Pi.createPayment(
      {
        amount: 1,
        memo: "giulexhubtest U2A",
        metadata: { type: "U2A_TEST" }
      },
      {
        onReadyForServerApproval: async (paymentId) => {
          statusEl.textContent = "Approving: " + paymentId;

          await fetch("/api/pi-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "approve",
              paymentId
            })
          });
        },

        onReadyForServerCompletion: async (paymentId, txid) => {
          statusEl.textContent =
            "Completing: " + paymentId + " txid: " + txid;

          await fetch("/api/pi-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "complete",
              paymentId,
              txid
            })
          });

          statusEl.textContent = "U2A completed ✅";
        },

        onCancel: (paymentId) => {
          statusEl.textContent = "Payment cancelled";
        },

        onError: (error) => {
          console.error(error);
          statusEl.textContent = "U2A failed ❌";
        }
      }
    );

  } catch (err) {
    console.error(err);
    statusEl.textContent = "U2A failed ❌";
  }
};

// 💰 A2U TEST
a2uBtn.onclick = async () => {

  statusEl.textContent = "Requesting A2U test...";

  try {
    const r = await fetch("/api/a2u", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uid: piUser.uid,
        amount: 1
      })
    });

    const data = await r.json();

    if (!data.success) {
      statusEl.textContent = "A2U error";
      return;
    }

    statusEl.textContent = "A2U created. Waiting for blockchain...";

  } catch (err) {
    console.error(err);
    statusEl.textContent = "A2U failed ❌";
  }
};

</script>

<div class="links">
  <a href="/privacy.html" target="_blank">Privacy Policy</a> |
  <a href="/terms.html" target="_blank">Terms of Service</a>
</div>

</body>
</html>
