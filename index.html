<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Giulex Hub Arena - Testnet Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });
  </script>
  <style>
    :root {
      --bg: #0f0f1a;
      --card-bg: #17172a;
      --primary: #5a6cff;
      --accent: #ff4757;
      --gold: #ffa502;
      --heal: #2ecc71;
      --text: #ffffff;
    }

    body { 
      margin: 0; 
      min-height: 100vh; 
      font-family: 'Segoe UI', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    .app { 
      width: 95%; 
      max-width: 450px; 
      background: var(--card-bg); 
      padding: 25px; 
      margin-top: 20px;
      border-radius: 24px; 
      border: 1px solid #3a3f58; 
      text-align: center; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 { margin: 0 0 10px 0; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); }

    .stats-bar { 
      display: flex; 
      justify-content: space-around; 
      background: rgba(0,0,0,0.3); 
      padding: 12px; 
      border-radius: 12px; 
      margin-bottom: 15px;
      font-weight: bold;
      font-family: monospace;
      border: 1px solid #222;
    }
    .lives { color: var(--accent); transition: all 0.3s; }
    .lives.heal { color: var(--heal); transform: scale(1.2); }
    .combo-text { color: var(--gold); height: 20px; font-size: 0.9rem; margin-bottom: 10px; font-weight: bold; }

    .grid { 
      display: grid; 
      gap: 8px; 
      margin: 0 auto 20px auto; 
    }
    .card { 
      aspect-ratio: 1; 
      background: #1a1a2e; 
      border: 2px solid var(--accent); 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.4rem; 
      cursor: pointer; 
      transition: transform 0.2s, background 0.2s;
    }
    /* Adattamento font per griglie fitte */
    .small-font { font-size: 1rem !important; }

    .card.flipped { background: var(--accent); }

    button { 
      width: 100%; 
      border-radius: 12px; 
      padding: 15px; 
      cursor: pointer; 
      font-weight: 700; 
      margin-top: 10px; 
      border: none; 
      text-transform: uppercase;
    }
    #login { background: var(--primary); color: #fff; }
    #u2a { background: var(--gold); color: #000; box-shadow: 0 4px 15px rgba(255, 165, 2, 0.3); }

    #status { 
      margin-top: 20px; 
      padding: 12px; 
      border-radius: 10px; 
      background: #000; 
      font-family: monospace; 
      font-size: 0.8rem; 
      color: #00ff00; 
      border: 1px solid #222;
    }

    footer { margin: 30px 0; font-size: 0.85rem; opacity: 0.7; }
    footer a { color: var(--primary); text-decoration: none; margin: 0 10px; }

    .shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <main class="app">
    <h2>⚔ ARENA PRO ⚔</h2>
    <div id="user-display" style="font-size: 0.9rem; margin-bottom: 15px; opacity: 0.8;">Accedi per giocare</div>
    
    <button id="login">ACCEDI CON PI BROWSER</button>

    <div id="game-ui" style="display: none;">
      <div class="stats-bar">
        <span>LVL: <span id="lvl">1</span></span>
        <span class="lives" id="lives-container">VITE: <span id="lives">5</span></span>
        <span>PTS: <span id="score">0</span></span>
      </div>
      
      <div id="combo-box" class="combo-text"></div>
      
      <div id="grid" class="grid"></div>

      <div id="payment-area">
        <button id="u2a">SBLOCCA PREMIUM (0.1 Test-π)</button>
      </div>
    </div>

    <div id="status">Stato: In attesa di login...</div>
  </main>

  <footer>
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/terms.html">Terms of Service</a>
  </footer>

  <script>
    const symbols = ["⚔", "🔥", "🛡", "🏹", "👑", "💎", "⚡", "🩸", "🧠", "🐉", "🌑", "☠", "🍄", "⭐", "🌪", "🧊", "🌋", "🧿"];
    let piUser = null;
    let cards = [];
    let selected = [];
    let score = 0;
    let level = 1;
    let lives = 5;
    let maxLivesAtLevelStart = 5;
    let combo = 0;
    let isPremium = false;

    const loginBtn = document.getElementById("login");
    const gameUI = document.getElementById("game-ui");
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const livesContainer = document.getElementById("lives-container");

    loginBtn.onclick = async () => {
      try {
        statusEl.textContent = "Autenticazione...";
        const auth = await Pi.authenticate(["username", "payments", "wallet_address"]);
        piUser = auth.user;
        document.getElementById("user-display").textContent = `Eroe: ${piUser.username}`;
        loginBtn.style.display = "none";
        gameUI.style.display = "block";
        initGame();
      } catch (err) { statusEl.textContent = "Errore: " + err.message; }
    };

    function initGame() {
      // Difficoltà Progressiva fino al livello 10
      let size;
      if (level === 1) size = 2; // Tutorial (2x2)
      else if (level <= 3) size = 4; // Facile (4x4)
      else if (level <= 6) size = 4; // Medio (Aggiungeremo più simboli)
      else if (level <= 9) size = 6; // Difficile (6x6)
      else size = 6; // Livello 10+ (Massima difficoltà)

      // Aumento progressivo delle vite iniziali (Max 10)
      maxLivesAtLevelStart = Math.min(5 + (level - 1), 10);
      if (!isPremium) lives = maxLivesAtLevelStart;

      const totalCards = size * size;
      const pairCount = totalCards / 2;
      
      let gameSymbols = symbols.slice(0, pairCount);
      let doubled = [...gameSymbols, ...gameSymbols].sort(() => Math.random() - 0.5);

      gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      gridEl.innerHTML = "";
      cards = [];
      selected = [];
      updateStats();

      doubled.forEach((sym, index) => {
        const cardObj = { id: index, value: sym, flipped: false, matched: false };
        cards.push(cardObj);
        const cardEl = document.createElement("div");
        cardEl.className = "card";
        if(size > 4) cardEl.classList.add("small-font");
        cardEl.onclick = () => handleFlip(cardObj, cardEl);
        gridEl.appendChild(cardEl);
      });
    }

    function handleFlip(card, el) {
      if (card.flipped || card.matched || selected.length === 2) return;
      if (!isPremium && lives <= 0) return;

      card.flipped = true;
      el.classList.add("flipped");
      el.textContent = card.value;
      selected.push({ card, el });

      if (selected.length === 2) setTimeout(checkMatch, 500);
    }

    function checkMatch() {
      const [a, b] = selected;
      if (a.card.value === b.card.value) {
        a.card.matched = b.card.matched = true;
        combo++;
        
        // --- NUOVA LOGICA: RECUPERO VITA ---
        if (!isPremium && lives < 10) {
          lives++;
          triggerHealEffect();
        }

        score += (isPremium ? 20 : 10) * combo;
        if(combo > 1) document.getElementById("combo-box").textContent = `COMBO X${combo}! (+1 Vita)`;
        else document.getElementById("combo-box").textContent = `OTTIMO! (+1 Vita)`;
        
        if (cards.every(c => c.matched)) {
          level++;
          statusEl.textContent = "LIVELLO SUPERATO! +1 Difficoltà";
          setTimeout(initGame, 1000);
        }
      } else {
        combo = 0;
        document.getElementById("combo-box").textContent = "";
        if (!isPremium) {
          lives--;
          gridEl.classList.add("shake");
          setTimeout(() => gridEl.classList.remove("shake"), 400);
        }
        setTimeout(() => {
          a.el.classList.remove("flipped"); b.el.classList.remove("flipped");
          a.el.textContent = ""; b.el.textContent = "";
          a.card.flipped = b.card.flipped = false;
        }, 400);
      }
      updateStats();
      selected = [];
    }

    function triggerHealEffect() {
      livesContainer.classList.add("heal");
      setTimeout(() => livesContainer.classList.remove("heal"), 500);
    }

    function updateStats() {
      document.getElementById("lvl").textContent = level;
      document.getElementById("lives").textContent = isPremium ? "∞" : lives;
      document.getElementById("score").textContent = score;
      if (lives <= 0 && !isPremium) {
        statusEl.textContent = "GAME OVER! Usa Premium per vite infinite.";
      }
    }

    // (Logica Pagamento u2aBtn.onclick rimane uguale a quella precedente)
    document.getElementById("u2a").onclick = async () => {
      // ... logica Pi.createPayment come sopra ...
      isPremium = true;
      updateStats();
    };
  </script>
</body>
</html>
