<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Giulex Hub Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

  <h1>Giulex Hub Testnet</h1>
  <button id="loginBtn">Login with Pi</button>

  <script>
    Pi.init({ version: "2.0" });

    const loginBtn = document.getElementById("loginBtn");

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment found:", payment);
    }

    loginBtn.addEventListener("click", async () => {
      try {
        // ✅ AUTH (PUNTO FERMO)
        const auth = await Pi.authenticate(
          ["username"],
          onIncompletePaymentFound
        );

        console.log("Auth success:", auth);

        const uid = auth.user.uid;
        console.log("User UID:", uid);

        // 🔥 A2U TESTNET CALL (SOLO DOPO AUTH)
        const response = await fetch("/api/a2u", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            uid: uid,
            amount: 1
          })
        });

        const result = await response.json();
        console.log("A2U response:", result);

        if (!response.ok) {
          alert("A2U error. Check console.");
          return;
        }

        alert("A2U request sent successfully.");

      } catch (err) {
        console.error("Auth error:", err);
        alert("Authentication failed.");
      }
    });
  </script>

</body>
</html>
